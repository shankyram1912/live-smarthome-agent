<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aris — Camera Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #000000;
            --panel-bg: rgba(24, 24, 26, 0.5);
            --panel-border: rgba(255, 255, 255, 0.08);
            --panel-highlight: inset 0 1px 1px rgba(255, 255, 255, 0.15);
            --text-primary: #F5F5F7;
            --text-secondary: #A1A1A6;
            --text-tertiary: #7A7A80;
            --apple-green: #30D158;
            --apple-green-glow: rgba(48, 209, 88, 0.4);
            --apple-red: #FF453A;
            --apple-red-glow: rgba(255, 69, 58, 0.4);
            --apple-blue: #0A84FF;
            --apple-blue-glow: rgba(10, 132, 255, 0.3);
            --apple-blue-bg: rgba(10, 132, 255, 0.15);
            --apple-orange: #FF9F0A;
            --glass-blur: blur(60px);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --mono: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 24px 60px;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(circle at 30% 50%, rgba(10,132,255,0.05) 0%, transparent 40%),
                radial-gradient(circle at 75% 25%, rgba(255,159,10,0.04) 0%, transparent 30%),
                radial-gradient(circle at 20% 80%, rgba(48,209,88,0.03) 0%, transparent 40%);
            animation: ambient-shift 25s ease-in-out infinite alternate;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes ambient-shift {
            0%   { transform: translate(0,0) scale(1); }
            100% { transform: translate(-3%,-3%) scale(1.05); }
        }

        .console-wrapper { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 20px; }

        /* ── HEADER ── */
        .console-header { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .header-icon {
            width: 40px; height: 40px; border-radius: 12px;
            background: var(--apple-blue-bg); border: 1px solid rgba(10,132,255,0.3);
            display: flex; align-items: center; justify-content: center; color: var(--apple-blue);
        }
        .header-icon svg { width: 20px; height: 20px; }
        .header-title { font-size: 22px; font-weight: 800; letter-spacing: -0.6px; color: #fff; }
        .header-subtitle { font-size: 12px; font-weight: 500; color: var(--text-tertiary); margin-top: 2px; }
        .engine-pill {
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
            padding: 5px 12px; border-radius: 14px;
            font-size: 11px; font-weight: 800; color: var(--text-secondary); letter-spacing: 0.8px; text-transform: uppercase;
        }

        /* ── GLASS PANEL ── */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--panel-border);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), var(--panel-highlight);
            border-radius: 28px; padding: 32px;
        }

        .section-label {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.4px; color: var(--text-tertiary); margin-bottom: 16px;
        }

        /* ── CAMERA GRID ── */
        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .camera-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .camera-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .camera-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--apple-green);
            box-shadow: 0 0 8px var(--apple-green-glow);
            transition: all 0.3s ease;
        }

        .camera-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .camera-id-pill {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
            color: var(--text-secondary);
        }

        .camera-view-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera-view-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block; /* Shown by default if src works */
        }

        .camera-fallback {
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-tertiary);
        }

        .camera-fallback svg {
            width: 32px;
            height: 32px;
            opacity: 0.5;
        }

        .camera-fallback-text {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: -0.1px;
        }

    </style>
</head>
<body>

    <div class="console-wrapper">
        <!-- Header -->
        <div class="console-header">
            <div class="header-left">
                <div class="header-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <div class="header-title">Camera Viewer</div>
                    <div class="header-subtitle">Live SmartHome Camera Feeds</div>
                </div>
            </div>
            <div class="engine-pill">genai-e2e-demos</div>
        </div>

        <!-- Panel -->
        <div class="glass-panel">
            <div class="section-label">Active Endpoints</div>

            <div class="camera-grid">
                
                <!-- Camera 1 -->
                <div class="camera-card">
                    <div class="camera-header">
                        <div class="camera-info">
                            <div class="status-dot"></div>
                            <span class="camera-title">Kitchen View</span>
                        </div>
                        <span class="camera-id-pill">cam-1</span>
                    </div>
                    <div class="camera-view-container">
                        <img src="/live-smarthome-agent/static/camview/cam-1.jpg" alt="Feed from cam-1" class="cam-img">
                        <div class="camera-fallback">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                            </svg>
                            <span class="camera-fallback-text">Camera not configured</span>
                        </div>
                    </div>
                </div>

                <!-- Camera 2 -->
                <div class="camera-card">
                    <div class="camera-header">
                        <div class="camera-info">
                            <div class="status-dot"></div>
                            <span class="camera-title">Front Door</span>
                        </div>
                        <span class="camera-id-pill">cam-2</span>
                    </div>
                    <div class="camera-view-container">
                        <img src="/live-smarthome-agent/static/camview/cam-2.jpg" alt="Feed from cam-2" class="cam-img">
                        <div class="camera-fallback">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                            </svg>
                            <span class="camera-fallback-text">Camera not configured</span>
                        </div>
                    </div>
                </div>

                <!-- Camera 3 -->
                <div class="camera-card">
                    <div class="camera-header">
                        <div class="camera-info">
                            <div class="status-dot"></div>
                            <span class="camera-title">Guest Bedroom</span>
                        </div>
                        <span class="camera-id-pill">cam-3</span>
                    </div>
                    <div class="camera-view-container">
                        <img src="/live-smarthome-agent/static/camview/cam-3.jpg" alt="Feed from cam-3" class="cam-img">
                        <div class="camera-fallback">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                            </svg>
                            <span class="camera-fallback-text">Camera not configured</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Script to handle missing images -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cameraImages = document.querySelectorAll('.cam-img');

            cameraImages.forEach(img => {
                // If the image fails to load (file not found/configured)
                img.addEventListener('error', function() {
                    // Hide the broken image tag
                    this.style.display = 'none';
                    
                    // Show the fallback text/icon
                    const fallback = this.nextElementSibling;
                    if (fallback) {
                        fallback.style.display = 'flex';
                    }

                    // Find the status dot in the header and turn it red
                    const card = this.closest('.camera-card');
                    if (card) {
                        const statusDot = card.querySelector('.status-dot');
                        if (statusDot) {
                            statusDot.style.background = 'var(--apple-red)';
                            statusDot.style.boxShadow = '0 0 8px var(--apple-red-glow)';
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aris Smart Home AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Link to the separated ADK App Logic -->
    <script src="/live-smarthome-agent/static/js/app.js" type="module"></script>
    <style>
        /* --- PREMIUM DESIGN SYSTEM --- */
        :root {
            --bg-base: #000000;
            --panel-bg: rgba(24, 24, 26, 0.5);
            --panel-border: rgba(255, 255, 255, 0.08);
            --panel-highlight: inset 0 1px 1px rgba(255, 255, 255, 0.15);

            --text-primary: #F5F5F7;
            --text-secondary: #A1A1A6;
            --text-tertiary: #7A7A80;

            --apple-green: #30D158;
            --apple-green-glow: rgba(48, 209, 88, 0.4);
            --apple-red: #FF453A;
            --apple-red-glow: rgba(255, 69, 58, 0.4);

            --apple-blue: #0A84FF;
            --apple-blue-glow: rgba(10, 132, 255, 0.3);
            --apple-blue-bg: rgba(10, 132, 255, 0.15);

            --glass-blur: blur(60px);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 40px;
            position: relative;
            text-rendering: optimizeLegibility;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 40% 60%, rgba(10, 132, 255, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 70% 30%, rgba(191, 90, 242, 0.04) 0%, transparent 30%),
                radial-gradient(circle at 20% 80%, rgba(48, 209, 88, 0.03) 0%, transparent 40%);
            animation: ambient-shift 25s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes ambient-shift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(-3%, -3%) scale(1.05);
            }
        }

        /* 2-Panel Layout */
        #dashboard {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 32px;
            width: 100%;
            max-width: 1400px;
            height: 100%;
            max-height: 800px;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--panel-border);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), var(--panel-highlight);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* PANEL 1: AI CORE */
        #voice-controller {
            justify-content: space-evenly;
            padding: 48px 40px;
            z-index: 10;
        }

        .agent-header {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: center;
        }

        .agent-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.8px;
            color: #FFFFFF;
        }

        .agent-subtitle {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: -0.1px;
        }

        .orb-interaction-zone {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 32px;
            padding: 10px;
        }

        .orb-interaction-zone:active {
            transform: scale(0.95);
        }

        .orb-container {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .orb {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #43CBFF 10%, #9708CC 100%);
            box-shadow: inset 0 10px 20px rgba(255, 255, 255, 0.4), inset 0 -10px 20px rgba(0, 0, 0, 0.4), 0 0 40px rgba(151, 8, 204, 0.4);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .orb::before,
        .orb::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            inset: -8px;
            background: inherit;
            opacity: 0.3;
            z-index: -1;
            transition: all 0.5s ease;
        }

        .state-idle .orb {
            transform: scale(1);
            animation: breathe 5s infinite ease-in-out;
        }

        .state-listening .orb {
            background: linear-gradient(135deg, #0A84FF 10%, #32D74B 100%);
            box-shadow: inset 0 10px 20px rgba(255, 255, 255, 0.4), 0 0 60px rgba(10, 132, 255, 0.6);
            animation: pulse-listen 1.2s infinite alternate ease-in-out;
        }

        .state-listening .orb::before {
            animation: ripple 1.5s infinite linear;
        }

        .state-listening .orb::after {
            animation: ripple 1.5s infinite linear 0.75s;
        }

        .state-speaking .orb {
            background: linear-gradient(135deg, #BF5AF2 10%, #FF375F 100%);
            box-shadow: inset 0 10px 20px rgba(255, 255, 255, 0.4), 0 0 80px rgba(191, 90, 242, 0.8);
            animation: speak-wave 0.7s infinite alternate ease-in-out;
        }

        .state-speaking .orb::before {
            animation: ripple 1s infinite linear;
        }

        /* --- NEW: THINKING STATE (Liquid Core + Nodes) --- */
        .state-thinking .orb {
            background: radial-gradient(circle at 50% 50%, #ffffff 0%, #d1d1d6 100%);
            animation: think-wave 2s infinite alternate ease-in-out;
        }

        .state-thinking .orb::before {
            inset: -20px;
            background: transparent;
            border: 3px dotted rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            mask-image: linear-gradient(to bottom, black 20%, transparent 80%);
            -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 80%);
            animation: spin-nodes 4s linear infinite;
            opacity: 1;
        }

        .state-thinking .orb::after {
            inset: -10px;
            background: transparent;
            border: 2px solid transparent;
            border-top: 3px solid #ffffff;
            border-right: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 -10px 20px -5px rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: spin-synthesis 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            opacity: 1;
        }

        .mic-instruction {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.04);
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .system-vitals {
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 24px;
            margin-top: auto;
            padding-bottom: 12px;
        }

        .vital-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .vital-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vital-label {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 16px;
            letter-spacing: -0.2px;
        }

        .vital-value.highlight-number {
            color: #FFFFFF;
            font-weight: 800;
            font-size: 24px;
            line-height: 1;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 69, 58, 0.15);
            color: var(--apple-red);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .status-badge.active {
            background: rgba(48, 209, 88, 0.15);
            color: var(--apple-green);
            box-shadow: 0 0 15px rgba(48, 209, 88, 0.1);
        }

        .status-badge.active::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--apple-green);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--apple-green);
            animation: blink 2s infinite ease-in-out;
        }

        .status-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        /* --- END CONVERSATION BUTTON --- */
        .end-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .end-btn-container.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .end-btn {
            background: rgba(255, 69, 58, 0.1);
            color: var(--apple-red);
            border: 1px solid rgba(255, 69, 58, 0.3);
            padding: 12px 32px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s ease;
        }

        .end-btn:hover {
            background: rgba(255, 69, 58, 0.25);
            box-shadow: 0 0 20px rgba(255, 69, 58, 0.2);
            transform: scale(1.02);
        }

        .end-btn:active {
            transform: scale(0.98);
        }

        /* --- ROW LAYOUT --- */
        .vital-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* --- TEXT STYLING --- */
        .vital-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 500;
        }

        .device-summary-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .summary-tag {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .tag-icon-mini {
            width: 16px;
            height: 16px;
            color: var(--text-tertiary);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tag-icon-mini svg {
            width: 100%;
            height: 100%;
            stroke-width: 2.5px;
        }

        .summary-tag span {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 16px;
        }

        /* --- RIGHT PANEL: DATA LAYER --- */
        .right-column {
            display: grid;
            grid-template-rows: minmax(120px, auto) 1fr;
            gap: 32px;
            height: 100%;
            position: relative;
        }

        /* PANEL 2: TRANSCRIPT LAYER */
        #transcript-panel {
            padding: 32px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
            position: relative;
            z-index: 2;
        }

        #transcript-panel::before {
            content: '';
            position: absolute;
            left: 0;
            top: 25%;
            height: 50%;
            width: 4px;
            background: var(--text-tertiary);
            border-radius: 0 4px 4px 0;
            opacity: 0.3;
        }

        .transcript-line {
            line-height: 1.3;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .transcript-line.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .user-text {
            color: var(--text-secondary);
            font-size: 20px;
            font-weight: 400;
            letter-spacing: -0.2px;
            font-style: italic;
            transition: opacity 0.5s ease;
        }

        .ai-text {
            font-weight: 600;
            font-size: 28px;
            letter-spacing: -0.6px;
            background: linear-gradient(180deg, #FFFFFF 0%, #B0B0B5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-height: 50px;
            line-height: 1.3;
        }

        /* SMART HOME GRID */
        #main-grid-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: filter 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
        }

        .grid-blurred {
            filter: blur(12px) brightness(0.3);
            opacity: 0.6;
            pointer-events: none;
            transform: scale(0.98);
        }

        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 0 12px;
        }

        .grid-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.6px;
            color: #FFFFFF;
        }

        #device-grid-container {
            padding: 32px 48px;
            display: flex;
            flex-direction: column;
            overflow-y: hidden;
            flex-grow: 1;
            position: relative;
            z-index: 1;
        }

        #device-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            align-content: start;
        }

        /* DEVICE CARDS */
        .device-card {
            background: rgba(20, 20, 22, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 28px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 180px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.1);
        }

        .device-card.on {
            background: var(--apple-blue-bg);
            border-color: rgba(10, 132, 255, 0.3);
            box-shadow: 0 12px 40px rgba(10, 132, 255, 0.25), 
                        inset 0 1px 2px rgba(255, 255, 255, 0.3), 
                        inset 0 0 20px rgba(10, 132, 255, 0.15);
        }

        .device-card.on::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, var(--apple-blue-glow) 0%, transparent 70%);
            opacity: 0.6;
            pointer-events: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 1;
        }

        .icon-container {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
        }

        .icon-container svg {
            width: 22px;
            height: 22px;
            stroke-width: 2px;
        }

        .device-card.on .icon-container {
            background: var(--apple-blue);
            color: #000;
            box-shadow: 0 0 20px var(--apple-blue-glow), inset 0 2px 4px rgba(255, 255, 255, 0.5);
        }

        .card-status-label {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-tertiary);
            text-transform: uppercase;
        }

        .device-card.on .card-status-label {
            color: var(--apple-blue);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1;
            width: 100%;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .device-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
            line-height: 1.2;
        }

        .room-name {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0px;
            line-height: 1.4;
        }

        .device-metric-pill {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            color: #FFFFFF;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        .device-card.on .device-metric-pill {
            background: rgba(10, 132, 255, 0.15);
            border-color: rgba(10, 132, 255, 0.3);
            color: #FFFFFF;
        }

        /* --- DYNAMIC HERO STACK OVERLAY --- */
        #hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(0, 0, 0, 0.2); 
        }

        #hero-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        #hero-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 620px; 
            padding: 80px 20px;
            max-height: 100%;
            overflow-y: auto;
            pointer-events: auto; 
            scrollbar-width: none; 
            -ms-overflow-style: none; 
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }
        
        #hero-stack::-webkit-scrollbar { display: none; }

        /* The Base Row Styling */
        .hero-row {
            border-radius: 28px;
            padding: 24px 28px;
            display: flex;
            align-items: center;
            gap: 24px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), inset 0 2px 2px rgba(255, 255, 255, 0.05);
            transform: translateY(30px) scale(0.95);
            opacity: 0;
            animation: slide-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            position: relative;
            overflow: hidden;
            flex-shrink: 0; 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes slide-in {
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .hero-row > * { z-index: 1; position: relative; }

        .hero-row-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
        }
        .hero-row-icon svg { width: 26px; height: 26px; stroke-width: 2.5px; }

        .hero-row-info { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        .hero-row-name { font-size: 20px; font-weight: 700; color: #FFF; letter-spacing: -0.3px; }
        .hero-row-room { font-size: 15px; font-weight: 500; color: var(--text-secondary); }

        .hero-row-action { display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 4px; }
        .hero-action-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; }
        .hero-action-metric { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1.5px; line-height: 1; color: #FFF; }

        /* STATE COLORS FOR DYNAMIC HERO ROWS */
        .hero-row.state-on { 
            background: linear-gradient(90deg, rgba(48, 209, 88, 0.25) 0%, rgba(20, 20, 22, 0.95) 60%);
            border-color: rgba(48, 209, 88, 0.4); 
            box-shadow: 0 20px 60px rgba(48, 209, 88, 0.1), inset 0 2px 2px rgba(255, 255, 255, 0.1); 
        }
        .hero-row.state-on .hero-row-icon { background: var(--apple-green); box-shadow: 0 0 20px var(--apple-green-glow); }
        .hero-row.state-on .hero-action-label { color: var(--apple-green); }

        .hero-row.state-off { 
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.08) 0%, rgba(20, 20, 22, 0.95) 60%);
            border-color: rgba(255, 255, 255, 0.1); 
        }
        .hero-row.state-off .hero-row-icon { background: rgba(255, 255, 255, 0.15); color: #FFF; box-shadow: none; }
        .hero-row.state-off .hero-action-label { color: var(--text-secondary); }
        .hero-row.state-off .hero-action-metric { color: var(--text-secondary); }

        .hero-row.state-cooling { 
            background: linear-gradient(90deg, rgba(10, 132, 255, 0.3) 0%, rgba(20, 20, 22, 0.95) 60%);
            border-color: rgba(10, 132, 255, 0.4); 
            box-shadow: 0 20px 60px rgba(10, 132, 255, 0.15), inset 0 2px 2px rgba(255, 255, 255, 0.1); 
        }
        .hero-row.state-cooling .hero-row-icon { background: var(--apple-blue); box-shadow: 0 0 20px var(--apple-blue-glow); }
        .hero-row.state-cooling .hero-action-label { color: var(--apple-blue); }

        .hero-row.state-heating { 
            background: linear-gradient(90deg, rgba(255, 69, 58, 0.25) 0%, rgba(20, 20, 22, 0.95) 60%);
            border-color: rgba(255, 69, 58, 0.4); 
            box-shadow: 0 20px 60px rgba(255, 69, 58, 0.15), inset 0 2px 2px rgba(255, 255, 255, 0.1); 
        }
        .hero-row.state-heating .hero-row-icon { background: var(--apple-red); box-shadow: 0 0 20px var(--apple-red-glow); }
        .hero-row.state-heating .hero-action-label { color: var(--apple-red); }

        /* ANIMATIONS */
        @keyframes breathe {
            0%, 100% { transform: scale(1); box-shadow: inset 0 10px 20px rgba(255, 255, 255, 0.4), 0 0 20px rgba(151, 8, 204, 0.2); }
            50% { transform: scale(1.03); box-shadow: inset 0 10px 20px rgba(255, 255, 255, 0.4), 0 0 45px rgba(151, 8, 204, 0.5); }
        }
        @keyframes pulse-listen {
            0% { transform: scale(1.05); }
            100% { transform: scale(1.2); box-shadow: inset 0 10px 20px rgba(255, 255, 255, 0.5), 0 0 90px rgba(48, 209, 88, 0.7); }
        }
        @keyframes spin-think {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
        @keyframes speak-wave {
            0% { transform: scale(1.05); border-radius: 50%; }
            50% { transform: scale(1.2); border-radius: 35% 65% 65% 35% / 35% 35% 65% 65%; }
            100% { transform: scale(1.1); border-radius: 65% 35% 35% 65% / 65% 65% 35% 35%; }
        }
        @keyframes ripple {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        /* --- NEW: THINKING ANIMATIONS --- */
        @keyframes think-wave {
            0% { transform: scale(0.98); border-radius: 50%; box-shadow: 0 0 20px rgba(255, 255, 255, 0.3), inset 0 0 10px #ffffff; }
            50% { transform: scale(1.04); border-radius: 35% 65% 65% 35% / 35% 35% 65% 65%; box-shadow: 0 0 35px rgba(255, 255, 255, 0.6), inset 0 0 20px #ffffff; }
            100% { transform: scale(1.01); border-radius: 65% 35% 35% 65% / 65% 65% 35% 35%; box-shadow: 0 0 50px rgba(255, 255, 255, 0.8), inset 0 0 30px #ffffff; }
        }
        @keyframes spin-nodes {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spin-synthesis {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.05); border-top-width: 5px; }
            100% { transform: rotate(360deg) scale(1); }
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>

<body>

    <div id="dashboard">
        <!-- 1. LEFT PANEL: AI CORE -->
        <div class="glass-panel" id="voice-controller">
            <div class="agent-header">
                <div class="agent-title">Aris Smart Home AI</div>
                <div class="agent-subtitle">ADK Agent Powered By Gemini Live Flash</div>
            </div>

            <!-- REGISTERED DEVICES SECTION -->
            <div class="vital-group"
                style="margin-top: 24px; padding-top: 24px; padding-bottom: 32px; border-top: 1px solid rgba(255,255,255,0.06); border-bottom: 1px solid rgba(255,255,255,0.06);">
                <div class="vital-row" style="align-items: center;">
                    <span style="color: #FFFFFF; font-weight: 600; font-size: 16px;">Registered Devices</span>
                    <span style="color: #FFFFFF; font-weight: 800; font-size: 32px; line-height: 1;"
                        id="device-count">0</span>
                </div>

                <div class="device-summary-list" style="margin-top: 16px;">
                    <div class="summary-tag">
                        <div class="tag-icon-mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M2 12h20M12 2v20M20 16l-4-4 4-4M4 8l4 4-4 4M16 4l-4 4-4-4M8 20l4-4 4 4" />
                            </svg></div>
                        <div style="display: flex; align-items: center; gap: 8px; width: 100%;">
                            <span id="count-ac">0</span> ACs
                        </div>
                    </div>

                    <div class="summary-tag">
                        <div class="tag-icon-mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path
                                    d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
                                <circle cx="12" cy="13" r="3" />
                            </svg></div>
                        <div><span id="count-camera">0</span> Cameras</div>
                    </div>
                    <div class="summary-tag">
                        <div class="tag-icon-mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path
                                    d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5" />
                                <path d="M9 18h6" />
                                <path d="M10 22h4" />
                            </svg></div>
                        <div><span id="count-light">0</span> Lights</div>
                    </div>
                    <div class="summary-tag">
                        <div class="tag-icon-mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg></div>
                        <div><span id="count-lock">0</span> Lock</div>
                    </div>
                </div>
            </div>

            <!-- ID added here for app.js to bind the connection -->
            <div class="orb-interaction-zone" id="orb-button">
                <div class="orb-container state-idle" id="orb-state">
                    <div class="orb"></div>
                </div>
                <div class="mic-instruction" id="mic-text">Tap to Connect</div>
            </div>

            <div class="system-vitals">
                <div class="vital-row">
                    <span class="vital-label">Agent Status</span>
                    <span class="status-badge" id="socket-status">Offline</span>
                </div>
                <div class="end-btn-container" id="end-btn-container">
                    <button class="end-btn" id="end-btn">End Conversation</button>
                </div>
            </div>
        </div>

        <!-- 2. RIGHT PANEL DATA LAYER -->
        <div class="right-column">         
            <div class="glass-panel" id="transcript-panel">
                <div class="user-text" id="transcript-user">Press connect, then speak...</div>
                <div class="ai-text" id="transcript-ai"></div>
            </div>

            <div class="glass-panel" id="device-grid-container">
                
                <!-- NEW HERO STACK OVERLAY INJECTED HERE -->
                <div id="hero-overlay">
                    <div id="hero-stack">
                        <!-- Dynamic Hero Rows will be injected here sequentially via JS -->
                    </div>
                </div>

                <div id="main-grid-wrapper">
                    <div class="grid-header">
                        <div class="grid-title">Environment Controls</div>
                    </div>
                    <div id="device-grid">
                        <!-- Cards generated via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // --- 1. FIREBASE SETUP ---
        const firebaseConfig = {
            apiKey: "AIzaSyAU4978uMcFABSTmOtC70ySsAP4yoJpqv8",
            authDomain: "genai-e2e-demos.firebaseapp.com",
            projectId: "genai-e2e-demos",
            storageBucket: "genai-e2e-demos.firebasestorage.app",
            messagingSenderId: "554686566379",
            appId: "1:554686566379:web:5b543c4b169319ffe913ae"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app, "live-smartcamera");

        // --- 2. ICON MAP & STATE ---
        const icons = {
            ac: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 12h20M12 2v20M20 16l-4-4 4-4M4 8l4 4-4 4M16 4l-4 4-4-4M8 20l4-4 4 4"/></svg>`,
            camera: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>`,
            light: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>`,
            lock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`
        };

        // EXPORT TO WINDOW SO APP.JS CAN READ THE DEVICE DATA
        window.devicesData = []; 

        // --- 3. RENDER LOGIC ---
        function renderDeviceGrid() {
            const grid = document.getElementById('device-grid');
            grid.innerHTML = '';

            window.devicesData.forEach(device => {
                const isOn = device.state === 'on';
                const deviceIcon = icons[device.deviceType] || ''; 
                const metricText = `${device.settingLabel}: ${device.currentSettingValue}`;

                const cardHTML = `
                    <div class="device-card ${isOn ? 'on' : 'off'}" id="${device.id}">
                        <div class="card-header">
                            <div class="icon-container">${deviceIcon}</div>
                            <div class="status-group">
                                <div class="card-status-label">${isOn ? 'ON' : 'OFF'}</div>
                                <div class="device-metric-pill">${metricText}</div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="card-info">
                                <span class="device-name">${device.deviceLabel}</span>
                                <span class="room-name">${device.room}</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // --- 4. REAL-TIME FIRESTORE LISTENER ---
        const docRef = doc(db, "home-users", "default");
        
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.devices) {
                    
                    window.devicesData = Object.values(data.devices);
                    window.devicesData.sort((a, b) => a.id.localeCompare(b.id));
                    
                    const typeCounts = { ac: 0, camera: 0, light: 0, lock: 0 };
                    window.devicesData.forEach(device => {
                        if (typeCounts[device.deviceType] !== undefined) {
                            typeCounts[device.deviceType]++;
                        }
                    });

                    const countAcEl = document.getElementById('count-ac');
                    const countCameraEl = document.getElementById('count-camera');
                    const countLightEl = document.getElementById('count-light');
                    const countLockEl = document.getElementById('count-lock');

                    if(countAcEl) countAcEl.innerText = typeCounts.ac;
                    if(countCameraEl) countCameraEl.innerText = typeCounts.camera;
                    if(countLightEl) countLightEl.innerText = typeCounts.light;
                    if(countLockEl) countLockEl.innerText = typeCounts.lock;

                    renderDeviceGrid();
                    
                    const deviceCountEl = document.getElementById('device-count');
                    if (deviceCountEl) deviceCountEl.innerText = window.devicesData.length;
                }
            } else {
                console.warn("No such document found in Firestore!");
            }
        });

        // --- 5. UI VISUAL EXPORTS (For app.js to trigger animations) ---
        window.setAgentState = function(state) {
            const orbContainer = document.getElementById('orb-state');
            const micText = document.getElementById('mic-text');
            if(orbContainer) {
                orbContainer.className = 'orb-container';
                orbContainer.classList.add(`state-${state.toLowerCase()}`);
            }
            if(micText) {
                const textMap = { 'IDLE': 'Tap to Connect', 'LISTENING': 'Listening...', 'THINKING': 'Thinking...', 'SPEAKING': 'Tap to Interrupt' };
                micText.innerText = textMap[state] || state;
            }
        };

        window.updateTranscript = function(userText, aiText) {
            const userEl = document.getElementById('transcript-user');
            const aiEl = document.getElementById('transcript-ai');

            if (userText !== null && userEl) {
                userEl.classList.remove('visible');
                setTimeout(() => { userEl.innerText = userText ? `"${userText}"` : ''; if (userText) userEl.classList.add('visible'); }, 400);
            }
            if (aiText !== null && aiEl) {
                aiEl.classList.remove('visible');
                setTimeout(() => { aiEl.innerText = aiText; if (aiText) aiEl.classList.add('visible'); }, 400);
            }
        };

        // --- 6. DYNAMIC HERO STACK EXPORT ---
        let heroDismissTimeout = null;

        window.addDynamicHeroAction = function(eventPayload) {
            const overlay = document.getElementById('hero-overlay');
            const stack = document.getElementById('hero-stack');
            const gridWrapper = document.getElementById('main-grid-wrapper');
            
            if (!overlay.classList.contains('active')) {
                overlay.classList.add('active');
                gridWrapper.classList.add('grid-blurred');
            }

            // Find device from Firebase data
            const device = window.devicesData.find(d => d.id === eventPayload.id);
            if (!device) return;

            let actionClass = '';
            let actionLabel = '';
            let metricText = '';
            
            const deviceType = device.deviceType; // From Firebase structure
            const newState = eventPayload.newState.toLowerCase();
            const currentSetting = (eventPayload.currentSettingValue || '').toLowerCase();

            if (newState === 'off') {
                actionClass = 'state-off'; actionLabel = 'Turned Off'; metricText = 'Off'; 
                if (deviceType === 'camera') actionLabel = 'Disabled';
                if (deviceType === 'lock') actionLabel = 'Disengaged';
            } else {
                if (deviceType === 'ac') {
                    const oldTemp = parseFloat(eventPayload.oldSettingValue);
                    const newTemp = parseFloat(eventPayload.currentSettingValue);

                    if (eventPayload.oldState === 'off') {
                        actionClass = 'state-on'; actionLabel = 'Turned On'; metricText = `${newTemp}°`;
                    } else if (newTemp < oldTemp) {
                        actionClass = 'state-cooling'; actionLabel = 'Cooling'; metricText = `${newTemp}°`;
                    } else if (newTemp > oldTemp) {
                        actionClass = 'state-heating'; actionLabel = 'Heating'; metricText = `${newTemp}°`;
                    } else {
                        actionClass = 'state-on'; actionLabel = 'Updated'; metricText = `${newTemp}°`;
                    }
                } 
                else if (deviceType === 'camera') {
                    if (currentSetting === 'online') { actionClass = 'state-cooling'; actionLabel = 'Mode Set'; metricText = 'Online'; } 
                    else if (currentSetting === 'private') { actionClass = 'state-heating'; actionLabel = 'Mode Set'; metricText = 'Private'; } 
                    else if (currentSetting === 'protection') { actionClass = 'state-on'; actionLabel = 'Mode Set'; metricText = 'Protect'; } 
                    else { actionClass = 'state-on'; actionLabel = 'Active'; metricText = 'On'; }
                }
                else if (deviceType === 'lock') {
                    if (currentSetting === 'locked') { actionClass = 'state-cooling'; actionLabel = 'Secured'; metricText = 'Locked'; } 
                    else if (currentSetting === 'unlocked') { actionClass = 'state-heating'; actionLabel = 'Unlocked'; metricText = 'Open'; } 
                    else if (currentSetting === 'protection') { actionClass = 'state-on'; actionLabel = 'Mode Set'; metricText = 'Protect'; } 
                    else { actionClass = 'state-on'; actionLabel = 'Secured'; metricText = 'Locked'; }
                }
                else if (deviceType === 'light') {
                    if (currentSetting === 'cool') { actionClass = 'state-cooling'; actionLabel = 'Scene Set'; metricText = 'Cool'; } 
                    else if (currentSetting === 'movie') { actionClass = 'state-heating'; actionLabel = 'Scene Set'; metricText = 'Movie'; } 
                    else if (currentSetting === 'bright') { actionClass = 'state-on'; actionLabel = 'Scene Set'; metricText = 'Bright'; } 
                    else { actionClass = 'state-on'; actionLabel = 'Turned On'; metricText = 'On'; }
                }
            }

            const fontSizeStyle = metricText.length > 6 ? 'font-size: 24px; letter-spacing: -0.5px;' : '';
            const deviceIcon = icons[deviceType] || '';

            const rowEl = document.createElement('div');
            rowEl.className = `hero-row ${actionClass}`;
            rowEl.innerHTML = `
                <div class="hero-row-icon">${deviceIcon}</div>
                <div class="hero-row-info">
                    <div class="hero-row-name">${device.deviceLabel}</div>
                    <div class="hero-row-room">${device.room}</div>
                </div>
                <div class="hero-row-action">
                    <div class="hero-action-label">${actionLabel}</div>
                    <div class="hero-action-metric" style="${fontSizeStyle}">${metricText}</div>
                </div>
            `;

            stack.appendChild(rowEl);
            
            // Auto scroll to bottom smoothly
            stack.scrollTo({
                top: stack.scrollHeight,
                behavior: 'smooth'
            });

            if (heroDismissTimeout) clearTimeout(heroDismissTimeout);
            heroDismissTimeout = setTimeout(() => {
                overlay.classList.remove('active');
                gridWrapper.classList.remove('grid-blurred');
                setTimeout(() => { stack.innerHTML = ''; }, 600);
            }, 3500); 
        };

        window.onload = () => {
            renderDeviceGrid();
        };
    </script>
</body>
</html>
